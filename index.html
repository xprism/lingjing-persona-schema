<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Documentation</title>
  <!-- GitHub Markdown 官方排版样式 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown.min.css">
  <!-- Markdown 极速解析器 Marked.js -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body {
      box-sizing: border-box;
      min-width: 200px;
      max-width: 980px;
      margin: 0 auto;
      padding: 45px;
      background-color: #0d1117; /* 深色背景，若要浅色改成 #ffffff */
    }
    @media (max-width: 767px) {
      body {
        padding: 15px;
      }
    }
  </style>
</head>
<body>
  <article id="content" class="markdown-body">
    <p>正在加载 README.md ...</p>
  </article>

  <script>
    // 异步拉取同级目录下的 README.md 并渲染
    fetch('./README.md')
      .then(response => {
        if (!response.ok) {
          throw new Error('未找到 README.md 文件 (HTTP ' + response.status + ')');
        }
        return response.text();
      })
      .then(markdown => {
        document.getElementById('content').innerHTML = marked.parse(markdown);
      })
      .catch(error => {
        document.getElementById('content').innerHTML = `
          <h2>加载失败</h2>
          <p>${error.message}</p>
          <p>请确保仓库根目录存在 <code>README.md</code> 文件。</p>
        `;
      });
  </script>
</body>
</html>
